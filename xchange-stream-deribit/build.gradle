plugins {
    id 'org.knowm.xchange.java-conventions'
}

dependencies {
    api project(':xchange-deribit')
    api project(':xchange-stream-core')
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.3'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

description = 'XChange Deribit Stream'

java {
    withJavadocJar()
}

test {
    useJUnitPlatform()
}
